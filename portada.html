<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cimiento Solar</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: #07121f;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            color: #fff;
        }

        .bg {
            position: fixed;
            inset: 0;
            background-image: url('Cimiento solar portada.png');
            background-size: cover;
            background-position: center;
            z-index: 0;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background:
                linear-gradient(180deg, rgba(2, 11, 20, 0.58), rgba(2, 11, 20, 0.78)),
                linear-gradient(90deg, rgba(0, 59, 92, 0.45), rgba(0, 0, 0, 0.14));
            z-index: 1;
        }

        .main {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 120px 24px 48px;
            max-width: 820px;
            width: 100%;
        }

        .logo-corner {
            position: fixed;
            top: 20px;
            left: 24px;
            z-index: 3;
        }

        .logo-img {
            height: clamp(88px, 12vw, 136px);
            object-fit: contain;
            filter: drop-shadow(0 12px 22px rgba(0,0,0,0.42));
        }

        .logo-fallback {
            display: none;
            align-items: center;
        }

        .logo-name {
            font-size: 16px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 0.08em;
        }

        .cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 520px) {
            body {
                align-items: flex-start;
                overflow-y: auto;
            }

            .main {
                padding-top: 132px;
                padding-bottom: 28px;
            }

            .logo-corner {
                left: 50%;
                transform: translateX(-50%);
            }

            .cards {
                grid-template-columns: 1fr;
                gap: 14px;
            }
        }

        .card {
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 18px 44px rgba(0, 0, 0, 0.28);
        }

        .card:hover {
            background: rgba(255, 255, 255, 0.16);
            transform: translateY(-4px);
            box-shadow: 0 24px 54px rgba(0, 0, 0, 0.42);
            border-color: rgba(255, 255, 255, 0.34);
        }

        .card:focus-visible {
            outline: 3px solid rgba(56, 189, 248, 0.85);
            outline-offset: 4px;
        }

        .card-img {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            display: block;
        }

        .card-label {
            padding: 18px 20px;
            font-size: 13px;
            font-weight: 900;
            color: #F1F5F9;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            width: 100%;
            text-align: center;
            background: rgba(2, 11, 20, 0.58);
        }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="overlay"></div>

    <div class="logo-corner">
        <img
            src="Logo cimiento solar blanco.png"
            alt="Cimiento Solar"
            class="logo-img"
            onerror="this.style.display='none'; document.querySelector('.logo-fallback').style.display='flex';"
        />
        <div class="logo-fallback">
            <span class="logo-name">CIMIENTO SOLAR</span>
        </div>
    </div>

    <div class="main">
        <div class="cards">
            <a href="index.html" class="card">
                <img src="sistema anclado.png" alt="Sistema Anclado" class="card-img" />
                <span class="card-label">Sistema Anclado</span>
            </a>
            <a href="Balastrado.html" class="card">
                <img src="balastrado.png" alt="Sistema Balastrado" class="card-img" />
                <span class="card-label">Sistema Balastrado</span>
            </a>
        </div>
    </div>
</body>
</html>

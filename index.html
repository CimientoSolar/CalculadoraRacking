                };
                const updatedPresets = [...presets, newPreset];
                setPresets(updatedPresets);
                localStorage.setItem('cimientoSolarPresets', JSON.stringify(updatedPresets));
                setNewPresetName('');
            };

            const loadPreset = (presetId) => {
                const preset = presets.find(p => p.id === presetId);
                if (preset) {
                    setColumnCode(preset.columnCode || 'RK-ECORIEL');
                    setRearLegHeight(preset.rearLegHeight || 100);
                    setFrontLegHeight(preset.frontLegHeight || 100);
                    setRearLegCustomItems(Array.isArray(preset.rear) ? JSON.parse(JSON.stringify(preset.rear)) : []);
                    setFrontLegCustomItems(Array.isArray(preset.front) ? JSON.parse(JSON.stringify(preset.front)) : []);
                    setSelectedPresetId(presetId);
                }
            };

            const deletePreset = (presetId) => {
                const updatedPresets = presets.filter(p => p.id !== presetId);
                setPresets(updatedPresets);
                localStorage.setItem('cimientoSolarPresets', JSON.stringify(updatedPresets));
                if (selectedPresetId === presetId) setSelectedPresetId(null);
            };

            const exportSinglePreset = (preset) => {
                const slug = preset.name.replace(/[^a-zA-Z0-9_\-áéíóúüñÁÉÍÓÚÜÑ ]/g, '').trim() || 'preset';
                const dataStr = JSON.stringify([preset], null, 2);
                const blob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${slug}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            const exportPresets = () => {
                if (presets.length === 0) {
                    alert('No hay presets para exportar');
                    return;
                }
                const dataStr = JSON.stringify(presets, null, 2);
                const dataBlob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(dataBlob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `cimiento-solar-presets-${new Date().toISOString().slice(0, 10)}.json`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            };

            const importPresets = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const importedPresets = JSON.parse(event.target.result);
                        if (Array.isArray(importedPresets)) {
                            const migrated = importedPresets.map(p => ({
                                ...p,
                                rear: Array.isArray(p.rear) ? p.rear : [],
                                front: Array.isArray(p.front) ? p.front : []
                            }));
                            setPresets(migrated);
                            localStorage.setItem('cimientoSolarPresets', JSON.stringify(migrated));
                            setSelectedPresetId(null);
                            alert(`✓ Se reemplazaron los presets. Se cargaron ${importedPresets.length} preset(s)`);
                        } else {
                            alert('❌ El archivo no contiene un formato válido de presets');
                        }
                    } catch (error) {
                        alert('❌ Error al importar el archivo: ' + error.message);
                    }
                };
                reader.readAsText(file);
            };

            // Conteo global reactivo para validación de cuadre
            const totalPanelesInstalados = useMemo(() => {
                let suma = 0;
                rows.forEach(r => r.arrangements.forEach(a => {
                    if (a.formato === 'grid') {
                        suma += (a.gridRows || 2) * (a.gridCols || 2);
                    } else {
                        suma += (a.panels || 0);
                    }
                }));
                return suma;
            }, [rows]);

            // GENERACIÓN DINÁMICA DEL BOM — el cálculo real vive en un Cloudflare Worker
            // (cf-worker/src/index.js), no aquí. El navegador solo manda los datos del
            // formulario y recibe el resultado ya calculado; las fórmulas nunca se exponen.
            const BOM_WORKER_URL = 'https://cimiento-solar-bom.luisbrito2000.workers.dev';

            const [bomData, setBomData] = useState({
                materials: [], railByRow: [], railCuts: [], consolidatedCuts: [],
                cutsByCategory: { rail: [], support: [], contraviento: [] }
            });
            const [bomLoading, setBomLoading] = useState(false);
            const [bomError, setBomError] = useState(null);
            const bomRequestIdRef = React.useRef(0);

            useEffect(() => {
                const requestId = ++bomRequestIdRef.current;
                const payload = {
                    rows, projectData, inventory, supportMode, rearLegCustomItems, frontLegCustomItems,
                    usaOptimizadores, numOptimizadores, optimizadorItems,
                    usaContraviento, contravientoLargueroCode, contravientoItems,
                    rearLegHeight, frontLegHeight, columnCode
                };

                const timer = setTimeout(async () => {
                    setBomLoading(true);
                    try {
                        const resp = await fetch(BOM_WORKER_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        if (!resp.ok) throw new Error(`Servidor respondió ${resp.status}`);
                        const data = await resp.json();
                        if (requestId === bomRequestIdRef.current) {
                            setBomData(data);
                            setBomError(null);
                        }
                    } catch (err) {
                        if (requestId === bomRequestIdRef.current) {
                            setBomError('No se pudo calcular el BOM: ' + err.message);
                        }
                    } finally {
                        if (requestId === bomRequestIdRef.current) setBomLoading(false);
                    }
                }, 400);

                return () => clearTimeout(timer);
            }, [rows, projectData, inventory, supportMode, rearLegCustomItems, frontLegCustomItems,
                usaOptimizadores, numOptimizadores, optimizadorItems,
                usaContraviento, contravientoLargueroCode, contravientoItems,
                rearLegHeight, frontLegHeight, columnCode]);

            React.useEffect(() => {
                if (pdfAfterLoadRef.current && bomData.railCuts.length > 0) {
                    pdfAfterLoadRef.current = false;
                    exportReportToPdf();
                }
            }, [bomData]);

            const exportProjectCSV = () => {
                const lines = [];
                lines.push('==Project==');
                Object.keys(projectData).forEach(k => {
                    let v = projectData[k];
                    if (typeof v === 'object') v = JSON.stringify(v);
                    // Escape quotes
                    const safe = String(v).replace(/"/g, '""');
                    lines.push(`${k},"${safe}"`);
                });
                lines.push('');
                lines.push('==Rows==');
                lines.push('rowId,rowName,arrangementId,panels,orientation,maxPanelsPerBlock,offset,customSeparation,usaMidSupport');
                rows.forEach(row => {
                    row.arrangements.forEach(arr => {
                        lines.push(`${row.id},"${row.name.replace(/"/g,'""')}",${arr.id},${arr.panels || 0},${arr.orientation},${arr.maxPanelsPerBlock || 0},${arr.offset || 0},${arr.customSeparation === null ? '' : arr.customSeparation},${arr.usaMidSupport ? 1 : 0}`);
                    });
                });
                lines.push('');
                lines.push('==PresetsJSON==');
                lines.push(JSON.stringify(presets || []));

                const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `cimiento-solar-project-${new Date().toISOString().slice(0,10)}.csv`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            const importProjectCSVFile = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const text = ev.target.result;
                        const lines = text.split(/\r?\n/);
                        // parse sections
                        const sections = {};
                        let section = null;
                        for (let i = 0; i < lines.length; i++) {
                            const l = lines[i].trim();
                            if (!l) continue;
                            if (l.startsWith('==') && l.endsWith('==')) { section = l.replace(/==/g,''); sections[section] = []; continue; }
                            if (section) sections[section].push(lines[i]);
                        }

                        if (sections.Project) {
                            const newProject = { ...projectData };
                            sections.Project.forEach(line => {
                                const parts = line.split(/,(.+)/);
                                if (parts.length >= 2) {
                                    const key = parts[0].trim();
                                    let val = parts[1].trim();
                                    if (val.startsWith('"') && val.endsWith('"')) val = val.slice(1, -1).replace(/""/g, '"');
                                    // try parse JSON
                                    try { if ((val.startsWith('{') || val.startsWith('['))) newProject[key] = JSON.parse(val); else if (!isNaN(val)) newProject[key] = parseFloat(val); else newProject[key] = val; } catch { newProject[key] = val; }
                                }
                            });
                            setProjectData(newProject);
                        }

                        if (sections.Rows) {
                            const dataLines = sections.Rows.slice(1);
                            const newRowsMap = {};
                            dataLines.forEach(l => {
                                const cols = l.split(',');
                                if (cols.length < 9) return;
                                const rowId = parseInt(cols[0], 10);
                                const rowName = cols[1].replace(/^"|"$/g, '').replace(/""/g,'"');
                                const arrId = parseFloat(cols[2]);
                                const panels = parseInt(cols[3]) || 0;
                                const orientation = cols[4] || 'Portrait';
                                const maxPanelsPerBlock = parseInt(cols[5]) || 0;
                                const offset = parseFloat(cols[6]) || 0;
                                const customSeparation = cols[7] === '' ? null : parseFloat(cols[7]);
                                const usaMidSupport = cols[8] === '1' || cols[8] === 'true';

                                if (!newRowsMap[rowId]) newRowsMap[rowId] = { id: rowId, name: rowName, numArrangements: 0, arrangements: [] };
                                newRowsMap[rowId].arrangements.push({ id: arrId, panels, orientation, maxPanelsPerBlock, offset, customSeparation, usaMidSupport });
                            });
                            const newRows = Object.values(newRowsMap).map(r => ({ ...r, numArrangements: r.arrangements.length }));
                            if (newRows.length > 0) setRows(newRows);
                        }

                        if (sections.PresetsJSON && sections.PresetsJSON.length > 0) {
                            try { const parsed = JSON.parse(sections.PresetsJSON.join('\n')); setPresets(Array.isArray(parsed) ? parsed : []); } catch (err) { console.warn('No se pudo parsear presets'); }
                        }

                        alert('Proyecto importado correctamente. Revisa la configuración y guarda si es necesario.');
                    } catch (err) {
                        alert('Error importando proyecto: ' + err.message);
                    }
                };
                reader.readAsText(file);
                // reset input value to allow re-import same file
                e.target.value = null;
            };

            const exportMaterialsCSV = () => {
                if (!bomData || !bomData.materials || bomData.materials.length === 0) { alert('No hay materiales para exportar'); return; }
                const lines = ['Código,Concepto,Cantidad'];
                bomData.materials.forEach(m => {
                    const concept = (m.concept || '').replace(/"/g, '""');
                    lines.push(`${m.code},"${concept}",${Number.isInteger(m.qty) ? m.qty : m.qty.toFixed(2)}`);
                });
                const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `cimiento-solar-materials-${new Date().toISOString().slice(0,10)}.csv`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            const loadTestData = () => {
                const projectNames = ['Residencial Norte', 'Comercial Centro', 'Industrial Sur', 'Escuela Primaria', 'Hospital Regional', 'Bodega Logística', 'Planta de Manufactura', 'Fraccionamiento Soleil'];
                const angles = [
                    { front: 'RK-P05-SC0', rear: 'RK-PR05-SC0' },
                    { front: 'RK-P10-SC0', rear: 'RK-PR10-SC0' }
                ];
                const panelSizes = [
                    { w: 113.4, l: 227.8 },
                    { w: 104.6, l: 209.2 },
                    { w: 108.0, l: 216.0 },
                    { w: 99.2,  l: 198.4 },
                ];
                const systemTypes = ['Anclado', 'Balastrado'];

                const angle      = angles[Math.floor(Math.random() * angles.length)];
                const panel      = panelSizes[Math.floor(Math.random() * panelSizes.length)];
                const systemType = systemTypes[Math.floor(Math.random() * systemTypes.length)];
                const numRows    = Math.floor(Math.random() * 3) + 1;

                // Distribuir ~100 paneles en múltiplos de 2, mínimo 4 por arreglo
                const rowDefs = Array.from({ length: numRows }, () => Math.floor(Math.random() * 3) + 1);
                const totalArrangements = rowDefs.reduce((s, n) => s + n, 0);
                const basePerArr = Math.round(100 / totalArrangements / 2) * 2;
                let remaining = 100;
                const panelCounts = rowDefs.flatMap((numArr, ri) =>
                    Array.from({ length: numArr }, (_, ai) => {
                        const isLast = ri === rowDefs.length - 1 && ai === numArr - 1;
                        if (isLast) return Math.max(4, remaining);
                        const v = Math.max(4, basePerArr + (Math.random() > 0.5 ? 2 : -2));
                        remaining -= v;
                        return v;
                    })
                );

                const newRows = [];
                let totalPanels = 0;
                let panelIdx = 0;

                for (let i = 0; i < numRows; i++) {
                    const numArr = rowDefs[i];
                    const arrangements = [];
                    for (let j = 0; j < numArr; j++) {
                        const panels = panelCounts[panelIdx++];
                        totalPanels += panels;
                        arrangements.push({
                            id: Date.now() + i * 1000 + j + Math.random(),
                            panels,
                            orientation: 'Portrait',
                            maxPanelsPerBlock: null,
                            offset: null,
                            customSeparation: null,
                            usaMidSupport: false,
                            redistributeRail: true,
                            contraviento: false,
                            contravientoLength: 0,
                            contravientoQty: 1,
                            formato: 'serie',
                            gridRows: 2,
                            gridCols: 2,
                            gridExtraRows: [{ id: Date.now() + Math.random(), rearHeight: 0, frontHeight: 0 }],
                            arrRearHeight: null,
                            arrFrontHeight: null
                        });
                    }
                    newRows.push({
                        id: Date.now() + i * 10000 + Math.random(),
                        name: `Fila ${i + 1}`,
                        numArrangements: numArr,
                        arrangements
                    });
                }

                const capacity = parseFloat((totalPanels * 0.55).toFixed(1));

                setProjectData(prev => ({
                    ...prev,
                    name: projectNames[Math.floor(Math.random() * projectNames.length)],
                    capacity,
                    systemType,
                    totalPanelesProyecto: totalPanels,
                    panelWidth: panel.w,
                    panelLength: panel.l,
                    endclampRequiresMidclamp: true,
                    frontLegCode: angle.front,
                    rearLegCode: angle.rear,
                    railCode: prev.railCode || 'RK-ECORIEL',
                    railLength: prev.railLength || 624,
                    separation: prev.separation || 140,
                }));

                setRows(newRows);
                setExpandedRows(new Set(newRows.map(r => r.id)));
                setSupportMode('armado');
            };

            const exportFullJSON = () => {
                const state = {
                    projectData,
                    rows,
                    supportMode,
                    rearLegCustomItems,
                    frontLegCustomItems,
                    columnCode,
                    rearLegHeight,
                    frontLegHeight,
                    usaOptimizadores,
                    numOptimizadores,
                    optimizadorItems,
                    usaContraviento,
                    contravientoLargueroCode,
                    contravientoItems,
                    presets,
                    inventory
                };
                const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `cimiento-solar-${new Date().toISOString().slice(0, 10)}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            const importFullJSON = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const state = JSON.parse(ev.target.result);
                        if (state.projectData) setProjectData(state.projectData);
                        if (state.rows && state.rows.length > 0) {
                            setRows(state.rows);
                            setExpandedRows(new Set(state.rows.map(r => r.id)));
                        }
                        if (state.supportMode) setSupportMode(state.supportMode);
                        if (state.rearLegCustomItems) setRearLegCustomItems(state.rearLegCustomItems);
                        if (state.frontLegCustomItems) setFrontLegCustomItems(state.frontLegCustomItems);
                        if (state.columnCode !== undefined) setColumnCode(state.columnCode);
                        if (state.rearLegHeight !== undefined) setRearLegHeight(state.rearLegHeight);
                        if (state.frontLegHeight !== undefined) setFrontLegHeight(state.frontLegHeight);
                        if (state.usaOptimizadores !== undefined) setUsaOptimizadores(state.usaOptimizadores);
                        if (state.numOptimizadores !== undefined) setNumOptimizadores(state.numOptimizadores);
                        if (state.optimizadorItems) setOptimizadorItems(state.optimizadorItems);
                        if (state.usaContraviento !== undefined) setUsaContraviento(state.usaContraviento);
                        if (state.contravientoLargueroCode !== undefined) setContravientoLargueroCode(state.contravientoLargueroCode);
                        if (state.contravientoItems) setContravientoItems(state.contravientoItems);
                        if (state.presets) {
                            setPresets(state.presets);
                            localStorage.setItem('cimientoSolarPresets', JSON.stringify(state.presets));
                        }
                        if (state.inventory) setInventory(state.inventory);
                        setSelectedPresetId(null);
                    } catch (err) {
                        alert('❌ Error al importar: ' + err.message);
                    }
                };
                reader.readAsText(file);
                e.target.value = null;
            };

            const exportReportToPdf = async () => {
                if (bomData.materials.length === 0 && bomData.railCuts.length === 0) {
                    alert('No hay datos suficientes para generar el reporte PDF.');
                    return;
                }

                const reportElement = document.getElementById('pdfReport');
                if (!reportElement) {
                    alert('No se encontró el elemento de reporte para exportar.');
                    return;
                }

                const origPos   = reportElement.style.position;
                const origLeft  = reportElement.style.left;
                const origTop   = reportElement.style.top;
                const origVis   = reportElement.style.visibility;

                reportElement.style.position   = 'absolute';
                reportElement.style.left       = '0';
                reportElement.style.top        = '0';
                reportElement.style.visibility = 'visible';

                try {
                    // ── Pre-cargar logo como dataURL para evitar problemas CORS ──
                    const logoImg = reportElement.querySelector('#pdfLogoImg');
                    if (logoImg) {
                        try {
                            const resp = await fetch('https://raw.githubusercontent.com/gavainc/Cimiento-Solar/main/Logo%20Cimiento%20Solar.png');
                            if (resp.ok) {
                                const blob = await resp.blob();
                                const dataUrl = await new Promise(res => {
                                    const r = new FileReader();
                                    r.onloadend = () => res(r.result);
                                    r.readAsDataURL(blob);
                                });
                                logoImg.src = dataUrl;
                                await new Promise(res => { logoImg.onload = res; logoImg.onerror = res; });
                            }
                        } catch (_) { /* logo se omite si falla la carga */ }
                    }

                    // ── Capturar canvas completo ──
                    const canvas = await window.html2canvas(reportElement, {
                        scale: 1, useCORS: true, backgroundColor: '#ffffff', logging: false
                    });

                    // ── Calcular altura de página en píxeles de canvas ──
                    const pdf       = new window.jspdf.jsPDF('p', 'mm', 'a4');
                    const pageW     = pdf.internal.pageSize.getWidth();   // 210 mm
                    const pageH     = pdf.internal.pageSize.getHeight();  // 297 mm
                    const marginX   = 10;
                    const marginY   = 10;
                    const imgW      = pageW - 2 * marginX;                // 190 mm
                    const pxPerMm   = canvas.width / imgW;                // px / mm
                    const pageHpx   = (pageH - 2 * marginY) * pxPerMm;   // px disponibles por página

                    // ── Recoger posiciones de corte seguro desde marcadores del DOM ──
                    const reportTop = reportElement.getBoundingClientRect().top;
                    const breaks = new Set([0]);
                    reportElement.querySelectorAll('[data-pdf-break]').forEach(el => {
                        const relTop = Math.round(el.getBoundingClientRect().top - reportTop);
                        if (relTop > 5) breaks.add(relTop);
                    });
                    const safeBreaks = [...breaks].sort((a, b) => a - b);
                    safeBreaks.push(canvas.height + 1);

                    // ── Construir rangos de página ──
                    const pageRanges = [];
                    let cur = 0;
                    while (cur < canvas.height) {
                        const target = cur + pageHpx;
                        // Último corte seguro que cabe en esta página
                        const candidates = safeBreaks.filter(y => y > cur && y <= target);
                        let end;
                        if (candidates.length > 0) {
                            end = candidates[candidates.length - 1];
                        } else {
                            // Ningún corte cabe: tomar el primer corte después del inicio
                            const next = safeBreaks.find(y => y > cur);
                            end = next !== undefined ? next : canvas.height;
                        }
                        end = Math.min(end, canvas.height);
                        if (end <= cur) break;
                        pageRanges.push({ start: cur, end });
                        cur = end;
                    }

                    // ── Renderizar cada página ──
                    for (let i = 0; i < pageRanges.length; i++) {
                        const { start, end } = pageRanges[i];
                        const h = end - start;
                        const pc = document.createElement('canvas');
                        pc.width  = canvas.width;
                        pc.height = h;
                        const ctx = pc.getContext('2d');
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, pc.width, h);
                        ctx.drawImage(canvas, 0, start, canvas.width, h, 0, 0, canvas.width, h);
                        const imgH = (h / canvas.width) * imgW;
                        if (i > 0) pdf.addPage();
                        pdf.addImage(pc.toDataURL('image/png'), 'PNG', marginX, marginY, imgW, imgH);
                    }

                    pdf.save(`reporte-cimiento-solar-${new Date().toISOString().slice(0,10)}.pdf`);

                } catch (error) {
                    alert('Error generando el PDF: ' + error.message);
                } finally {
                    reportElement.style.position   = origPos;
                    reportElement.style.left       = origLeft;
                    reportElement.style.top        = origTop;
                    reportElement.style.visibility = origVis;
                }
            };

                                <a

                                                                            <label className="text-[9px] text-purple-700 uppercase font-bold whitespace-nowrap">Front</label>

                                                                                value={arr.arrFrontHeight !== null && arr.arrFrontHeight !== undefined ? arr.arrFrontHeight : ''}

                                                                                onChange={e => updateArrangementField(row.id, arr.id, 'arrFrontHeight', e.target.value)} />
                                                                            <span className="text-[9px] text-purple-500 font-mono">cm</span>

                                                                                    value={extraRow.rearHeight || ''}

                                                                                <input type="number" min="0" className="input-field font-mono text-center py-1 w-16"
                                                                                    value={extraRow.frontHeight || ''}

                                                                                <span className="text-[9px] text-purple-500 font-mono">cm</span>

                                                                    </div>
                                                                    </div>
                                                                    )}

                                                            {bomData.railCuts.map((cut, cutIdx) => {

                                                                const cardBorder  = cut.validationError ? 'bg-red-50 border-red-400'    : cut.redistributed ? 'bg-orange-50 border-orange-300' : cut.shortRemainder ? 'bg-yellow-50 border-yellow-300' : 'bg-green-50 border-green-200';

                                                                                    {cut.fullTrays > 0 && <span className="text-[13px] font-bold text-gray-500">+</span>}

                                                                                </span>
                                                                            )}
                                                                        </div>
                                                                    </div>

                                                        </div>

                        {/* PANEL LATERAL: BOM Y CANDADO SEMÁFORO GLOBAL */}

                                                if (!g) { g = { rowName: cut.rowName, cuts: [] }; grouped.push(g); }
                                                g.cuts.push(cut);
                                            });
                                            return (
                                                <div className="space-y-5 mb-4">
                                                    {grouped.map(({ rowName, cuts }) => (
                                                        <div key={rowName} className="rounded-lg overflow-hidden shadow-md border border-gray-200">
                                                            {/* Encabezado de fila */}
                                                            <div className="px-4 py-3 bg-[#003B5C] text-white flex items-center justify-between">
                                                                <span className="text-[16px] font-bold uppercase tracking-[0.14em]">{rowName}</span>

                                        };
                                        return grouped.map(({ rowName, cuts }) => (
                                            <div key={rowName} data-pdf-break style={{marginBottom: '16px', borderRadius: '6px', overflow: 'hidden', border: '1px solid #E2E8F0', boxShadow: '0 1px 3px rgba(0,0,0,0.06)'}}>
                                                {/* Fila header */}
                                                <div style={{background: '#003B5C', padding: '9px 14px', display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
                                                    <div style={{fontSize: '12px', fontWeight: 800, color: '#fff', textTransform: 'uppercase', letterSpacing: '0.12em'}}>{rowName}</div>
                                                    <div style={{fontSize: '11px', color: '#93C5FD', fontWeight: 600}}>{cuts.length} arreglo{cuts.length !== 1 ? 's' : ''} — {cuts.reduce((s, c) => s + 2 * (c.gridRows || 1), 0)} líneas</div>
                                                </div>
                                                {/* Arrangement rows */}
                                                {cuts.map((cut, ci) => {
                                                    const gridRows = cut.gridRows || 1;
                                                    const isGrid = cut.isGrid;
                                                    const totalLineas = 2 * gridRows;
                                                    const totalSoportes = cut.supportsPerLine * totalLineas;
                                                    const cutsPerLine = cut.numSegmentsSplitted > 0 ? cut.numSegmentsSplitted : ((cut.segmentSize || 0) > 0 ? 1 : 0);
                                                    const allRows = [{ label: isGrid ? 'Fila 1' : null, rear: cut.effRear, front: cut.effFront }];
                                                    if (isGrid) (cut.extraRows || []).forEach((er, i) => allRows.push({ label: `Fila ${i+2}`, rear: er.rearHeight || 0, front: er.frontHeight || 0 }));
                                                    return (
                                                        <div key={ci} data-pdf-break style={{borderBottom: ci < cuts.length - 1 ? '1px solid #E2E8F0' : 'none', padding: '12px 14px', background: ci % 2 === 0 ? '#fff' : '#FAFBFC', display: 'flex', gap: '14px', alignItems: 'flex-start'}}>
                                                            {/* Arreglo label */}
                                                            <div style={{minWidth: '90px'}}>
                                                                <div style={{fontSize: '13px', fontWeight: 900, color: '#111827'}}>{cut.arrName}</div>
                                                                <div style={{display: 'inline-block', marginTop: '4px', padding: '2px 7px', borderRadius: '999px', fontSize: '10px', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.06em', background: isGrid ? '#EDE9FE' : '#F1F5F9', color: isGrid ? '#6D28D9' : '#475569', border: `1px solid ${isGrid ? '#DDD6FE' : '#CBD5E1'}`}}>{isGrid ? `Grid ${gridRows}×${cut.gridCols}` : 'Serie'}</div>
                                                                <div style={{display: 'inline-block', marginTop: '4px', marginLeft: '4px', padding: '2px 7px', borderRadius: '999px', fontSize: '10px', fontWeight: 700, textTransform: 'uppercase', background: '#FEF3C7', color: '#92400E', border: '1px solid #FDE68A'}}>{cut.totalPanels} mód.</div>
                                                            </div>
                                                            {/* SOPORTES */}
                                                            <div style={{flex: 1, borderLeft: '3px solid #3B82F6', paddingLeft: '10px'}}>
                                                                <div style={{fontSize: '9px', fontWeight: 700, color: '#3B82F6', textTransform: 'uppercase', letterSpacing: '0.14em', marginBottom: '3px'}}>Soportes</div>
                                                                <div style={{display: 'flex', alignItems: 'baseline', gap: '5px'}}>
                                                                    <span style={{fontSize: '24px', fontWeight: 900, color: '#1E3A5F', lineHeight: 1}}>{totalSoportes}</span>
                                                                    <span style={{fontSize: '11px', color: '#6B7280'}}>{cut.supportsPerLine}/l × {totalLineas} l</span>
                                                                </div>
                                                                {supportMode === 'personalizado' && (
                                                                    <div style={{marginTop: '5px', paddingTop: '5px', borderTop: '1px solid #DBEAFE'}}>
                                                                        {allRows.map((r, ri) => (
                                                                            <div key={ri} style={{display: 'flex', gap: '8px', fontSize: '11px', color: '#1E40AF', marginBottom: '2px'}}>
                                                                                {r.label && <span style={{fontWeight: 700, minWidth: '40px', color: '#3B82F6'}}>{r.label}</span>}
                                                                                <span>R <strong>{r.rear > 0 ? `${r.rear}cm` : '—'}</strong></span>
                                                                                <span style={{color: '#BFDBFE'}}>·</span>
                                                                                <span>F <strong>{r.front > 0 ? `${r.front}cm` : '—'}</strong></span>
                                                                            </div>
                                                                        ))}
                                                                    </div>
                                                                )}
                                                                {supportMode === 'armado' && <div style={{fontSize: '11px', color: '#6B7280', fontStyle: 'italic', marginTop: '3px'}}>Kit Armado</div>}
                                                            </div>
                                                            {/* RIELES */}
                                                            <div style={{flex: 1.4, borderLeft: '3px solid #10B981', paddingLeft: '10px'}}>
                                                                <div style={{fontSize: '9px', fontWeight: 700, color: '#10B981', textTransform: 'uppercase', letterSpacing: '0.14em', marginBottom: '3px'}}>Rieles</div>
                                                                <div style={{fontSize: '10px', fontWeight: 600, color: '#6B7280', marginBottom: '3px'}}>Por línea</div>
                                                                <div style={{fontFamily: 'monospace', fontSize: '12px', color: '#064E3B', fontWeight: 600, marginBottom: '5px'}}>{fmtLine(cut)}</div>
                                                                <div style={{borderTop: '1px solid #D1FAE5', paddingTop: '5px'}}>
                                                                    <div style={{fontSize: '10px', fontWeight: 600, color: '#6B7280', marginBottom: '2px'}}>Total — {totalLineas} líneas</div>
                                                                    <div style={{display: 'flex', gap: '6px', alignItems: 'baseline', flexWrap: 'wrap'}}>
                                                                        {(cut.fullTrays || 0) > 0 && <span style={{fontSize: '14px', fontWeight: 900, color: '#064E3B'}}>{(cut.fullTrays || 0) * totalLineas}<span style={{fontSize: '11px', fontWeight: 500, color: '#6B7280'}}> tramos</span></span>}
                                                                        {(cut.fullTrays || 0) > 0 && cutsPerLine > 0 && (cut.segmentSize || 0) > 0 && <span style={{color: '#9CA3AF', fontSize: '12px'}}>+</span>}
                                                                        {cutsPerLine > 0 && (cut.segmentSize || 0) > 0 && <span style={{fontSize: '14px', fontWeight: 900, color: '#064E3B'}}>{cutsPerLine * totalLineas}<span style={{fontSize: '11px', fontWeight: 500, color: '#6B7280'}}> cortes {Math.ceil(cut.segmentSize)}cm</span></span>}
                                                                    </div>
                                                                </div>
                                                            </div>
                                                            {/* CONTRAVIENTO */}
                                                            {cut.tieneContraviento && cut.contravientoLength > 0 && (
                                                                <div style={{flex: 0.8, borderLeft: '3px solid #0EA5E9', paddingLeft: '10px'}}>
                                                                    <div style={{fontSize: '9px', fontWeight: 700, color: '#0EA5E9', textTransform: 'uppercase', letterSpacing: '0.14em', marginBottom: '3px'}}>Contraviento</div>
                                                                    <div style={{display: 'flex', alignItems: 'baseline', gap: '4px'}}>
                                                                        <span style={{fontSize: '24px', fontWeight: 900, color: '#0C4A6E', lineHeight: 1}}>{cut.contravientoQty}</span>
                                                                        <span style={{fontSize: '11px', color: '#6B7280'}}>× {cut.contravientoLength}cm</span>
                                                                    </div>
                                                                    <div style={{fontSize: '12px', fontWeight: 700, color: '#0C4A6E', marginTop: '3px'}}>{cut.contravientoQty * cut.contravientoLength} cm</div>
                                                                </div>
                                                            )}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        ));
                                    })()}
                                </section>
                            )}

                        </div>

                        {/* ── FOOTER ── */}
                        <div style={{background: '#F1F5F9', borderTop: '3px solid #003B5C', padding: '10px 32px', display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
                            <div style={{fontSize: '10px', color: '#003B5C', fontWeight: 700, letterSpacing: '0.1em', textTransform: 'uppercase'}}>Cimiento Solar — Reporte de Instalación</div>
                            <div style={{fontSize: '10px', color: '#64748B'}}>{new Date().toLocaleDateString('es-ES')}</div>
                        </div>
                    </div>

                    {/* Floating Dev Toolbar */}
                    <div className="fixed bottom-5 right-5 z-50 flex items-center gap-1.5">
                        <button
                            onClick={loadTestData}
                            title="Cargar datos de prueba aleatorios"
                            className="px-3 py-1.5 text-[9px] font-bold uppercase tracking-widest rounded border border-gray-400/20 bg-white/10 text-gray-400/40 backdrop-blur-sm cursor-pointer select-none transition-all duration-300 hover:bg-white hover:text-[#003B5C] hover:border-[#003B5C]/60 hover:shadow-lg hover:scale-105"
                        >
                            ⚡ Test
                        </button>
                        <button
                            onClick={exportFullJSON}
                            title="Exportar proyecto completo como JSON"
                            className="px-3 py-1.5 text-[9px] font-bold uppercase tracking-widest rounded border border-gray-400/20 bg-white/10 text-gray-400/40 backdrop-blur-sm cursor-pointer select-none transition-all duration-300 hover:bg-white hover:text-[#003B5C] hover:border-[#003B5C]/60 hover:shadow-lg hover:scale-105"
                        >
                            ↓ Exportar Proyecto
                        </button>
                        <label
                            title="Importar proyecto desde JSON"
                            className="px-3 py-1.5 text-[9px] font-bold uppercase tracking-widest rounded border border-gray-400/20 bg-white/10 text-gray-400/40 backdrop-blur-sm cursor-pointer select-none transition-all duration-300 hover:bg-white hover:text-[#003B5C] hover:border-[#003B5C]/60 hover:shadow-lg hover:scale-105"
                        >
                            ↑ Importar Proyecto
                            <input type="file" accept=".json" className="hidden" onChange={importFullJSON} />
                        </label>
                    </div>

                    <footer className="max-w-7xl mx-auto mt-16 text-center text-[10px] text-gray-400 uppercase tracking-[0.3em] pb-12">
                        CIMIENTO SOLAR | Software de Ingeniería y Logística Industrial
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Root />);
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            console.log("Cimiento Solar Engine Initialized Successfully.");
        });
    </script>
</body>
</html>
